name: tester-env-leantime

services:
  app:
    container_name: tester-env-leantime-app
    build:
      context: .dev
      dockerfile: Dockerfile
    ports:
      - "5080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/html
      - ./.dev/error_reporting.ini:/usr/local/etc/php/conf.d/error_reporting.ini:ro
    environment:
      LEAN_APP_URL: ""
      LEAN_DB_HOST: mysql
      LEAN_DB_USER: leantime
      LEAN_DB_PASSWORD: leantime
      LEAN_DB_DATABASE: leantime
      LEAN_DB_PORT: "3306"
      LEAN_EMAIL_USE_SMTP: "false"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - leantime-net

  mysql:
    container_name: tester-env-leantime-mysql
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: leantime
      MYSQL_USER: leantime
      MYSQL_PASSWORD: leantime
      MYSQL_DATABASE: leantime
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: "mysql -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1'"
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - leantime-net

volumes:
  mysql-data:
    name: tester-env-leantime-mysql-data

networks:
  leantime-net:
    name: tester-env-leantime-net
