# tester-env deployment overlay (standalone; does not shadow upstream compose).
# No fixed container_name / network / volume names and no fixed host port, so
# several RUN_ID-scoped projects can coexist. The tester-env CLI sets the
# compose project name (-p tester-env-leantime[-$RUN_ID]) and exports PORT,
# LEAN_APP_URL and IMAGE_NAME. RUN_ID scopes containers/networks/volumes via
# the project name only; it never scopes the image name (see Image Tag Policy
# in docs/APP_CLI_PATTERN.md).
services:
  app:
    build:
      context: .dev
      dockerfile: Dockerfile
    image: "${IMAGE_NAME:-tester-env-leantime:dev}"
    ports:
      - "${PORT:-5080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/html
      - ./.dev/error_reporting.ini:/usr/local/etc/php/conf.d/error_reporting.ini:ro
    environment:
      LEAN_APP_URL: "${LEAN_APP_URL:-}"
      LEAN_DB_HOST: mysql
      LEAN_DB_USER: leantime
      LEAN_DB_PASSWORD: leantime
      LEAN_DB_DATABASE: leantime
      LEAN_DB_PORT: "3306"
      LEAN_EMAIL_USE_SMTP: "false"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - leantime-net

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: leantime
      MYSQL_USER: leantime
      MYSQL_PASSWORD: leantime
      MYSQL_DATABASE: leantime
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: "mysql -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1'"
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - leantime-net

volumes:
  mysql-data:

networks:
  leantime-net:
